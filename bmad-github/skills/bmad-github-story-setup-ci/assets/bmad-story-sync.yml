name: BMAD Story Sync

on:
  issues:
    types: [closed]

concurrency:
  group: bmad-story-sync
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      # BMad runs its Python scripts through uv (required since BMad v6.11).
      - uses: astral-sh/setup-uv@v10.3.3

      - name: Resolve BMAD implementation artifacts directory
        id: bmad-config
        run: |
          if [ ! -f _bmad/scripts/resolve_config.py ]; then
            echo "::error::_bmad/scripts/resolve_config.py not found. Commit BMad's _bmad/ folder (BMad v6.12+)."
            exit 1
          fi
          # BMad's own resolver merges the committed config layers:
          # _bmad/config.toml and _bmad/custom/config.toml (user layers are gitignored).
          ARTIFACTS=$(uv run _bmad/scripts/resolve_config.py --project-root "$GITHUB_WORKSPACE" \
            --key modules.bmm.implementation_artifacts \
            | jq -r '."modules.bmm.implementation_artifacts" // empty')
          if [ -z "$ARTIFACTS" ]; then
            echo "::error::modules.bmm.implementation_artifacts is not set in the BMad config."
            exit 1
          fi
          ARTIFACTS="${ARTIFACTS//\{project-root\}/$GITHUB_WORKSPACE}"
          ARTIFACTS="${ARTIFACTS#"$GITHUB_WORKSPACE"/}"
          echo "artifacts=$ARTIFACTS" >> "$GITHUB_OUTPUT"
          echo "Resolved artifacts directory: $ARTIFACTS"

      - name: Sync closed issue to BMAD
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ARTIFACTS: ${{ steps.bmad-config.outputs.artifacts }}
        run: |
          ISSUE_MAP="$ARTIFACTS/github-issue-map.json"
          SPRINT_STATUS="$ARTIFACTS/sprint-status.yaml"

          # 1. Find the story key for this issue number
          STORY_KEY=$(jq -r --argjson num "$ISSUE_NUMBER" \
            'to_entries[] | select(.value.number == $num) | .key' \
            "$ISSUE_MAP")

          if [ -z "$STORY_KEY" ]; then
            echo "Issue #$ISSUE_NUMBER is not mapped to a BMAD story. Skipping."
            exit 0
          fi

          echo "Found story $STORY_KEY for issue #$ISSUE_NUMBER"

          # 2. Find the full sprint key and current status
          SPRINT_LINE=$(grep "^  ${STORY_KEY}-[a-z0-9]" "$SPRINT_STATUS" | head -1)

          if [ -z "$SPRINT_LINE" ]; then
            echo "::warning::Story $STORY_KEY not found in sprint-status.yaml"
            exit 0
          fi

          SPRINT_KEY=$(echo "$SPRINT_LINE" | sed 's/:.*//' | sed 's/^  //')
          CURRENT_STATUS=$(echo "$SPRINT_LINE" | sed 's/.*: //')

          if [ "$CURRENT_STATUS" = "done" ]; then
            echo "Story $STORY_KEY is already done. Nothing to sync."
            exit 0
          fi

          # 3. Find the PR that closed this issue.
          # Uses canonical event data (issue timeline), NOT the search index, which is
          # eventually consistent and reliably stale 5–30 s after a merge — the exact
          # window in which the `issues.closed` webhook fires.
          MERGED_PR=$(gh api graphql \
            -F owner="${GITHUB_REPOSITORY%%/*}" \
            -F repo="${GITHUB_REPOSITORY##*/}" \
            -F num="$ISSUE_NUMBER" \
            -f query='
              query($owner: String!, $repo: String!, $num: Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $num) {
                    timelineItems(itemTypes: [CLOSED_EVENT], last: 1) {
                      nodes {
                        ... on ClosedEvent {
                          closer {
                            __typename
                            ... on PullRequest { number state }
                          }
                        }
                      }
                    }
                  }
                }
              }' \
            --jq '.data.repository.issue.timelineItems.nodes[0].closer
                  | select(.__typename == "PullRequest" and .state == "MERGED")
                  | .number // empty')

          if [ -z "$MERGED_PR" ]; then
            echo "::warning::Issue #$ISSUE_NUMBER (story $STORY_KEY) closed without a merged PR. Skipping."
            exit 0
          fi

          echo "Verified merged PR #$MERGED_PR for story $STORY_KEY"

          # 4. Update sprint-status.yaml
          sed -i "s/^  ${SPRINT_KEY}: .*$/  ${SPRINT_KEY}: done/" "$SPRINT_STATUS"
          # Same timestamp format BMad's own sprint sync writes (MM-DD-YYYY HH:MM).
          sed -i "s/^last_updated: .*$/last_updated: $(date -u '+%m-%d-%Y %H:%M')/" "$SPRINT_STATUS"
          echo "Updated sprint-status.yaml: $SPRINT_KEY -> done"

          # 5. Update a legacy story file (bmad-create-story format, `Status:` line).
          # bmad-build spec files (spec-<key>-*.md) are left alone: bmad-build owns
          # their frontmatter `status`.
          STORY_FILE=$(ls "${ARTIFACTS}/${STORY_KEY}"-*.md 2>/dev/null | head -1)
          if [ -n "$STORY_FILE" ] && grep -q '^Status: ' "$STORY_FILE"; then
            sed -i 's/^Status: .*/Status: done/' "$STORY_FILE"
            echo "Updated $STORY_FILE -> done"
          fi

          # 6. Update GitHub issue labels
          gh issue edit "$ISSUE_NUMBER" \
            --remove-label "status:backlog" \
            --remove-label "status:ready" \
            --remove-label "status:in-progress" \
            --remove-label "status:review" \
            --add-label "status:done" 2>/dev/null || true
          echo "Updated labels on issue #$ISSUE_NUMBER"

          # 7. Check epic completion
          EPIC=$(echo "$STORY_KEY" | cut -d'-' -f1)
          ALL_DONE=true

          for key in $(jq -r --arg e "$EPIC" \
            'to_entries[] | select(.key | startswith($e + "-")) | .key' \
            "$ISSUE_MAP"); do
            match=$(grep "^  ${key}-[a-z0-9]" "$SPRINT_STATUS" | head -1)
            if [ -n "$match" ]; then
              status=$(echo "$match" | sed 's/.*: //')
              if [ "$status" != "done" ]; then
                ALL_DONE=false
                break
              fi
            fi
          done

          if [ "$ALL_DONE" = true ]; then
            sed -i "s/^  epic-${EPIC}: .*$/  epic-${EPIC}: done/" "$SPRINT_STATUS"
            echo "All stories complete - updated epic-${EPIC} -> done"
          fi

          # Export for commit step
          echo "STORY_KEY=$STORY_KEY" >> "$GITHUB_ENV"
          echo "MERGED_PR=$MERGED_PR" >> "$GITHUB_ENV"
          echo "ARTIFACTS=$ARTIFACTS" >> "$GITHUB_ENV"
          echo "CHANGES=true" >> "$GITHUB_ENV"

      - name: Commit and push
        if: env.CHANGES == 'true'
        run: |
          # Canonical github-actions[bot] identity — 41898282 is the bot's user ID.
          # This exact pair is what makes commits show as authored by the bot in the UI; do not "fix" it.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ARTIFACTS/"
          if git diff --cached --quiet; then
            echo "No file changes detected."
            exit 0
          fi
          git commit -m "chore(sync): mark story $STORY_KEY done (PR #$MERGED_PR)"
          # --autostash: LFS-tracked files under docs/reference-data/** are checked
          # out as pointers (no lfs: true), so the index sees them as unstaged. The
          # rebase needs a clean tree even though those changes are unrelated.
          git pull --rebase --autostash
          git push