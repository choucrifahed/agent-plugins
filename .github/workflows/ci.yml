name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Lint, format & import sorting
        run: npx @biomejs/biome ci .

      - name: Test
        run: npm test